<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pleed Command</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background-glow"></div>

    <section class="hero">
        <h1 id="name">Loading...</h1>
        <p id="description"></p>
    </section>

    <section>
        <div class="command-card">
            <h3>Usage</h3>
            <code id="usage"></code>

            <h3>Permissions</h3>
            <p id="permissions"></p>

            <h3>Category</h3>
            <p id="category"></p>
        </div>
    </section>

    <script>
        const API = "https://YOUR-RENDER-URL.onrender.com/commands/";
        
        // Extracts the command name from "?command_name" or URL path
        const command = location.search 
            ? location.search.substring(1) 
            : location.pathname.split("/").pop();

        async function load() {
            try {
                const response = await fetch(API + command);
                const data = await response.json();

                if (data.error) {
                    document.getElementById("name").innerText = "Error";
                    document.getElementById("description").innerText = data.error;
                    return;
                }

                document.getElementById("name").innerText = "/" + data.name;
                document.getElementById("description").innerText = data.description;
                document.getElementById("usage").innerText = data.usage;
                document.getElementById("permissions").innerText = data.permissions.join(", ") || "Everyone";
                document.getElementById("category").innerText = data.category;
            } catch (err) {
                console.error("Failed to load command:", err);
                document.getElementById("name").innerText = "Error";
                document.getElementById("description").innerText = "Failed to load command details.";
            }
        }

        load();
    </script>
</body>
</html>

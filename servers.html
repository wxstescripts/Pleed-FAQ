<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pleed | Servers</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="background-glow"></div>

  <nav>
    <div class="brand">
      <img src="assets/logo.png" alt="Pleed Logo">
      <span>Pleed</span>
    </div>

    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="commands.html">Commands</a>
      <a href="servers.html">Servers</a>
      <a href="docs.html">Docs</a>
    </div>
  </nav>

  <header class="hero">
    <div class="status">
      <span></span>
      Server Showcase
    </div>

    <h1>Pleed Communities</h1>
    <p>Servers powered by Pleed.</p>
  </header>

  <section>
    <div id="servers" class="commands-grid">
      <div class="card">
        <h2>Loading servers...</h2>
      </div>
    </div>
  </section>

  <script>
    async function loadServers() {
      try {
        const response = await fetch("https://pleed-api.onrender.com/servers");

        if (!response.ok) {
          throw new Error("Failed to load server data");
        }

        const data = await response.json();
        displayServers(data.servers || []);
      } catch (error) {
        const container = document.getElementById("servers");
        container.innerHTML = `
          <div class="card">
            <h2>Unable to load servers</h2>
          </div>
        `;
        console.error("Error loading servers:", error);
      }
    }

    function displayServers(servers) {
      const container = document.getElementById("servers");
      container.innerHTML = "";

      if (servers.length === 0) {
        container.innerHTML = `
          <div class="card">
            <h2>No servers found</h2>
          </div>
        `;
        return;
      }

      servers.forEach(server => {
        container.innerHTML += `
          <div class="server-card">
            ${server.banner ? `<img class="server-banner" src="${server.banner}" alt="${server.name} banner">` : ""}

            <div class="server-content">
              <img class="server-icon" src="${server.icon}" alt="${server.name} icon">

              <h2>
                ${server.name}
                ${server.verified ? " ✓" : ""}
              </h2>

              <p>${(server.members || 0).toLocaleString()} Members</p>

              <p>${server.description || ""}</p>

              <span>
                Usage: ${(server.usageCount || 0).toLocaleString()}
              </span>
            </div>
          </div>
        `;
      });
    }

    loadServers();
  </script>

</body>

</html>

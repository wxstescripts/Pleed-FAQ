<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pleed | Servers</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="background-glow"></div>

  <nav>
    <div class="brand">
      <img src="assets/logo.png" alt="Pleed Logo">
      <span>Pleed</span>
    </div>

    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="commands.html">Commands</a>
      <a href="servers.html">Servers</a>
      <a href="docs.html">Docs</a>
    </div>

    <a class="nav-button" href="https://discord.com/oauth2/authorize?client_id=1484703029243416757">Invite</a>
  </nav>

  <header class="hero">
    <div class="status">
      <span></span>
      Live Communities
    </div>

    <h1>Pleed Communities</h1>
    <p>Discover servers powered by Pleed.</p>
  </header>

  <section>
    <div class="server-controls">
      <input id="search" placeholder="Search servers...">
      <select id="sort">
        <option value="members">Most Members</option>
        <option value="usage">Most Active</option>
      </select>
    </div>

    <div id="servers" class="servers-grid">
      <div class="server-card">
        <h2>Loading servers...</h2>
        <p>Connecting to Pleed API</p>
      </div>
    </div>
  </section>

  <footer>
    <p>© 2026 Pleed Development</p>
  </footer>

  <script>
    let allServers = [];
    const container = document.getElementById("servers");

    async function loadServers() {
      try {
        const response = await fetch("https://pleed-api.onrender.com/servers");
        const data = await response.json();
        allServers = data.servers || [];
        displayServers(allServers);
      } catch (error) {
        container.innerHTML = `
          <div class="server-card">
            <h2>Unable to load servers</h2>
            <p>Pleed API unavailable</p>
          </div>
        `;
        console.error(error);
      }
    }

    function displayServers(servers) {
      container.innerHTML = "";

      if (!servers || servers.length === 0) {
        container.innerHTML = `
          <div class="server-card">
            <h2>No servers found</h2>
          </div>
        `;
        return;
      }

      servers.forEach(server => {
        container.innerHTML += `
          <div 
            class="server-card"
            onclick="openServer('${server.id}')"
            style="cursor: pointer;"
          >
            <div class="server-banner">
              ${server.banner ? `<img src="${server.banner}" alt="Banner">` : `<div class="no-banner"></div>`}
            </div>

            <div class="server-info">
              <img class="server-icon" src="${server.icon || 'assets/logo.png'}" alt="${server.name} Icon">
              <div>
                <h2>
                  ${server.name}
                  ${server.verified ? '<span class="verified">✓</span>' : ''}
                </h2>
                <p>${server.description || 'Powered by Pleed'}</p>
              </div>
            </div>

            <div class="server-stats">
              <div>
                <b>${(server.members || 0).toLocaleString()}</b>
                <span>Members</span>
              </div>
              <div>
                <b>${(server.usageCount || 0).toLocaleString()}</b>
                <span>Commands Used</span>
              </div>
            </div>
          </div>
        `;
      });
    }

    document.getElementById("search").addEventListener("input", e => {
      const value = e.target.value.toLowerCase();
      displayServers(
        allServers.filter(server =>
          server.name.toLowerCase().includes(value)
        )
      );
    });

    document.getElementById("sort").addEventListener("change", e => {
      let sorted = [...allServers];

      if (e.target.value === "members") {
        sorted.sort((a, b) => (b.members || 0) - (a.members || 0));
      }

      if (e.target.value === "usage") {
        sorted.sort((a, b) => (b.usageCount || 0) - (a.usageCount || 0));
      }

      displayServers(sorted);
    });

    function openServer(id) {
      window.location.href = `server.html?id=${id}`;
    }

    loadServers();
  </script>

</body>

</html>

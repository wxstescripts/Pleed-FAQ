<body>

<header class="hero">


<div class="status">

<span></span>

Command Center

</div>


<h1>
Pleed Commands
</h1>


<p>
Browse all available Pleed commands.
</p>


</header>





<section>


<div class="command-search">

<input
id="search"
placeholder="Search commands..."
>


</div>




<div class="categories">

<button onclick="filterCommands('all')">
All
</button>

<button onclick="filterCommands('Moderation')">
Moderation
</button>

<button onclick="filterCommands('Tickets')">
Tickets
</button>

<button onclick="filterCommands('Security')">
Security
</button>

<button onclick="filterCommands('Utility')">
Utility
</button>


</div>





<div id="commands" class="commands-grid">

<div class="card">

<h2>
Loading Commands...
</h2>

<p>
Connecting to Pleed API
</p>

</div>

</div>



</section>






<footer>


<div class="footer-brand">

<img src="assets/logo.png">

<span>
Pleed

</div>

</p>


</footer>





<script>


let allCommands = [];


const container =
document.getElementById("commands");


const search =
document.getElementById("search");



async function loadCommands(){


try {


const response =
await fetch(
"https://api.pleed.bot/commands"
);



allCommands =
await response.json();



displayCommands(allCommands);



}

catch(error){


container.innerHTML = `

<div class="card">

<h2>
Unable to load commands
</h2>

<p>
Pleed API is currently unavailable.
</p>

</div>

`;


console.error(error);


}


}





function displayCommands(commands){


container.innerHTML = "";


commands.forEach(command => {


container.innerHTML += `


<div class="command-card"
data-category="${command.category}">


<div class="command-name">

/${command.name}

</div>


<h3>

${command.category}

</h3>


<p>

${command.description}

</p>


<span>

Permission:
${command.permission}

</span>


<code>

${command.usage}

</code>


</div>


`;

});


}





function filterCommands(category){


if(category === "all"){

displayCommands(allCommands);

return;

}



displayCommands(

allCommands.filter(
command =>
command.category === category
)

);


}





search.addEventListener(
"input",
() => {


const value =
search.value.toLowerCase();



displayCommands(

allCommands.filter(
command =>
JSON.stringify(command)
.toLowerCase()
.includes(value)
)

);


});





loadCommands();


</script>



</body>

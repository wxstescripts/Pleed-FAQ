<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pleed | Server</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="background-glow"></div>

  <nav>
    <div class="brand">
      <img src="assets/logo.png" alt="Pleed Logo">
      <span>Pleed</span>
    </div>

    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="commands.html">Commands</a>
      <a href="servers.html">Servers</a>
      <a href="docs.html">Docs</a>
    </div>
  </nav>

  <header class="hero">
    <div class="status">
      <span></span>
      Server Showcase
    </div>

    <h1>Community</h1>
    <p>Powered by Pleed</p>
  </header>

  <section>
    <div id="server-page">
      <div class="server-card">
        <h2>Loading server...</h2>
      </div>
    </div>
  </section>

  <script>
    const id = new URLSearchParams(window.location.search).get("id");

    async function loadServer() {
      const container = document.getElementById("server-page");

      try {
        const response = await fetch("https://pleed-api.onrender.com/servers");
        const data = await response.json();
        const server = data.servers?.find(s => String(s.id) === String(id));

        if (!server) {
          container.innerHTML = `
            <div class="server-card">
              <h2>Server not found</h2>
            </div>
          `;
          return;
        }

        container.innerHTML = `
          <div class="server-card">
            <div class="server-banner">
              ${server.banner ? `<img src="${server.banner}" alt="Banner">` : `<div class="no-banner"></div>`}
            </div>

            <div class="server-info">
              <img class="server-icon" src="${server.icon || 'assets/logo.png'}" alt="${server.name} Icon">
              <div>
                <h2>
                  ${server.name}
                  ${server.verified ? '<span class="verified">✓</span>' : ''}
                </h2>
                <p>${server.description || 'Powered by Pleed'}</p>
              </div>
            </div>

            <div class="server-stats">
              <div>
                <b>${(server.members || 0).toLocaleString()}</b>
                <span>Members</span>
              </div>
              <div>
                <b>${(server.usageCount || 0).toLocaleString()}</b>
                <span>Commands Used</span>
              </div>
            </div>

            ${
              server.invite
                ? `
                  <div style="padding:25px;text-align:center">
                    <a 
                      class="primary"
                      href="${server.invite}"
                      target="_blank"
                      rel="noopener noreferrer"
                    >
                      Join ${server.name}
                    </a>
                  </div>
                `
                : `
                  <div style="padding:25px;text-align:center;opacity:.7">
                    Invite unavailable
                  </div>
                `
            }
          </div>
        `;
      } catch (error) {
        console.error(error);
        container.innerHTML = `
          <div class="server-card">
            <h2>Unable to load server</h2>
          </div>
        `;
      }
    }

    loadServer();
  </script>

</body>

</html>

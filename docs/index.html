<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Command Documentation</title>
  <style>
    :root {
      --void: #09050b;
      --plum: #140d16;
      --card-bg: rgba(44, 26, 48, 0.6);
      --violet: #674b6c;
      --lavender: #c2a6c3;
      --pink: #ead8e8;
      --white: #f4ecf3;
      --border: rgba(194, 166, 195, 0.25);
      --code-bg: rgba(9, 5, 11, 0.8);
      --accent-green: #72ff8a;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--void);
      color: var(--pink);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      overflow-x: hidden;
    }

    body.menu-open {
      overflow: hidden;
    }

    /* Mobile Header / Top Bar */
    .mobile-header {
      display: none;
      align-items: center;
      justify-content: space-between;
      padding: 15px 20px;
      background: var(--plum);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .mobile-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--white);
    }

    .menu-toggle-btn {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--pink);
      font-size: 20px;
      padding: 6px 12px;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    .menu-toggle-btn:hover {
      background: var(--card-bg);
      color: var(--white);
    }

    /* Layout Wrapper */
    .app-container {
      display: flex;
      flex: 1;
      width: 100%;
    }

    /* Drawer Overlay */
    .drawer-overlay {
      position: fixed;
      inset: 0;
      background: rgba(9, 5, 11, 0.75);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      z-index: 9998;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .drawer-overlay.visible {
      opacity: 1;
      pointer-events: auto;
    }

    /* Sidebar Navigation */
    .sidebar-nav {
      width: 280px;
      background: var(--plum);
      border-right: 1px solid var(--border);
      padding: 25px 15px;
      height: 100vh;
      overflow-y: auto;
      position: sticky;
      top: 0;
      flex-shrink: 0;
      z-index: 9999;
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .sidebar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding: 0 5px;
    }

    .sidebar-header h2 {
      margin: 0;
      font-size: 18px;
      color: var(--white);
      font-weight: 700;
    }

    .close-btn {
      display: none;
      background: none;
      border: none;
      color: var(--pink);
      font-size: 20px;
      cursor: pointer;
    }

    .category-btn {
      width: 100%;
      text-align: left;
      background: transparent;
      border: 1px solid transparent;
      color: var(--pink);
      padding: 12px 14px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.2s ease;
    }

    .category-btn:hover {
      background: rgba(194, 166, 195, 0.1);
      color: var(--white);
    }

    .category-btn.active {
      background: var(--card-bg);
      border-color: var(--border);
      color: var(--white);
      font-weight: 700;
    }

    .count-badge {
      font-size: 12px;
      background: rgba(9, 5, 11, 0.6);
      border: 1px solid var(--border);
      padding: 2px 8px;
      border-radius: 12px;
      color: var(--lavender);
    }

    /* Main Content Area */
    .content-area {
      flex: 1;
      padding: 40px;
      max-width: 950px;
      margin: 0 auto;
      width: 100%;
    }

    .content-header {
      margin-bottom: 30px;
    }

    .content-header h1 {
      font-size: 32px;
      margin: 0 0 20px 0;
      color: var(--white);
    }

    /* Live Search Input */
    .search-box {
      width: 100%;
      padding: 14px 18px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      color: var(--white);
      font-size: 15px;
      outline: none;
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      transition: border-color 0.3s ease, box-shadow 0.3s ease;
    }

    .search-box:focus {
      border-color: var(--lavender);
      box-shadow: 0 0 15px rgba(194, 166, 195, 0.2);
    }

    .search-box::placeholder {
      color: rgba(234, 216, 232, 0.5);
    }

    /* Command Cards */
    .command-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 16px;
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .command-card:hover {
      border-color: var(--lavender);
      transform: translateY(-2px);
    }

    .command-header-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }

    .command-name {
      font-family: "Fira Code", monospace;
      font-size: 18px;
      color: var(--lavender);
      font-weight: 800;
    }

    .command-usage {
      font-family: "Fira Code", monospace;
      background: var(--code-bg);
      border: 1px solid rgba(114, 255, 138, 0.2);
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 13px;
      color: var(--accent-green);
    }

    .command-desc {
      color: var(--pink);
      opacity: 0.9;
      font-size: 14px;
      margin: 0;
      line-height: 1.5;
    }

    /* Responsive Styles */
    @media (max-width: 800px) {
      .mobile-header {
        display: flex;
      }

      .sidebar-nav {
        position: fixed;
        top: 0;
        left: 0;
        transform: translateX(-100%);
        box-shadow: 10px 0 30px rgba(0, 0, 0, 0.8);
      }

      .sidebar-nav.open {
        transform: translateX(0);
      }

      .close-btn {
        display: block;
      }

      .content-area {
        padding: 20px 15px;
      }

      .content-header h1 {
        font-size: 26px;
      }
    }
  </style>
</head>
<body>

  <!-- Mobile Top Header Bar -->
  <header class="mobile-header">
    <span class="mobile-title">Documentation</span>
    <button id="menu-btn" class="menu-toggle-btn" aria-label="Open Navigation">☰</button>
  </header>

  <div class="app-container">
    <!-- Mobile Drawer Overlay -->
    <div id="drawer-overlay" class="drawer-overlay"></div>

    <!-- Navigation Drawer / Sidebar -->
    <nav class="sidebar-nav" id="sidebarNav">
      <div class="sidebar-header">
        <h2>Categories</h2>
        <button id="close-drawer" class="close-btn" aria-label="Close Navigation">✕</button>
      </div>
      <div id="categoriesList"></div>
    </nav>

    <!-- Main Content Area -->
    <main class="content-area">
      <div class="content-header">
        <h1 id="activeCategoryTitle">Commands</h1>
        <input 
          type="text" 
          id="searchInput" 
          class="search-box" 
          placeholder="Search commands, syntax, or descriptions..." 
        />
      </div>
      <div id="commandList"></div>
    </main>
  </div>

  <script>
    // Commands data source
    const commandsData = {
      "AI": [{ "name": "ai", "usage": ",ai <question>", "description": "Ask the AI a question." }],
      "AntiNuke": [{ "name": "antinuke", "usage": ",antinuke", "description": "Configure antinuke protection." }],
      "AutoMod": [{ "name": "automod", "usage": ",automod", "description": "Configure automod settings." }],
      "Automation": [
        { "name": "automation", "usage": ",automation", "description": "Automation control panel." },
        { "name": "reactadd", "usage": ",reactadd <emoji> <trigger>", "description": "Add auto reaction." },
        { "name": "autorespond", "usage": ",autorespond <trigger> <response>", "description": "Add auto response." }
      ],
      "Benchmark": [
        { "name": "benchmark", "usage": ",benchmark", "description": "Run full performance benchmark." },
        { "name": "benchdb", "usage": ",benchdb", "description": "Run database benchmark." }
      ],
      "Config": [
        { "name": "prefix", "usage": ",prefix <new_prefix>", "description": "Set server command prefix." },
        { "name": "setwelcome", "usage": ",setwelcome <channel>", "description": "Set welcome channel." }
      ],
      "Economy": [
        { "name": "balance", "usage": ",balance [member]", "description": "View balance." },
        { "name": "work", "usage": ",work", "description": "Work to earn money." },
        { "name": "daily", "usage": ",daily", "description": "Claim daily reward." }
      ],
      "Leveling": [
        { "name": "rank", "usage": ",rank [member]", "description": "View your rank or another user's rank." },
        { "name": "leaderboard", "usage": ",leaderboard", "description": "View leveling leaderboard." }
      ],
      "Moderation": [
        { "name": "kick", "usage": ",kick <member> [reason]", "description": "Kick a member from the server." },
        { "name": "ban", "usage": ",ban <member> [reason]", "description": "Ban a member from the server." },
        { "name": "mute", "usage": ",mute <member> [duration]", "description": "Mute a member." },
        { "name": "purge", "usage": ",purge <amount>", "description": "Delete messages in channel." }
      ],
      "Music": [
        { "name": "play", "usage": ",play <query>", "description": "Play a song in voice channel." },
        { "name": "skip", "usage": ",skip", "description": "Skip current playing song." },
        { "name": "queue", "usage": ",queue [page]", "description": "Show music queue." }
      ],
      "VoiceMaster": [
        { "name": "setupvc", "usage": ",setupvc [category]", "description": "Setup VoiceMaster trigger channel." },
        { "name": "vclock", "usage": ",vclock", "description": "Lock private voice channel." },
        { "name": "vcpermit", "usage": ",vcpermit <member>", "description": "Permit member into locked channel." }
      ]
    };

    let currentCategory = Object.keys(commandsData)[0];

    // DOM Elements
    const menuBtn = document.getElementById("menu-btn");
    const closeBtn = document.getElementById("close-drawer");
    const sidebarNav = document.getElementById("sidebarNav");
    const drawerOverlay = document.getElementById("drawer-overlay");
    const categoriesList = document.getElementById("categoriesList");
    const commandList = document.getElementById("commandList");
    const searchInput = document.getElementById("searchInput");
    const activeCategoryTitle = document.getElementById("activeCategoryTitle");

    // Drawer Controls
    function openDrawer() {
      sidebarNav.classList.add("open");
      drawerOverlay.classList.add("visible");
      document.body.classList.add("menu-open");
    }

    function closeDrawer() {
      sidebarNav.classList.remove("open");
      drawerOverlay.classList.remove("visible");
      document.body.classList.remove("menu-open");
    }

    // Render Sidebar Navigation
    function renderSidebar() {
      categoriesList.innerHTML = "";

      Object.keys(commandsData).forEach((cat) => {
        const btn = document.createElement("button");
        btn.className = `category-btn ${cat === currentCategory ? "active" : ""}`;
        btn.innerHTML = `<span>${cat}</span><span class="count-badge">${commandsData[cat].length}</span>`;
        btn.onclick = () => {
          currentCategory = cat;
          searchInput.value = "";
          selectCategory(cat, btn);
          closeDrawer();
        };
        categoriesList.appendChild(btn);
      });

      if (currentCategory) {
        loadCommands(commandsData[currentCategory]);
      }
    }

    function selectCategory(category, btnElement) {
      document.querySelectorAll(".category-btn").forEach(b => b.classList.remove("active"));
      if (btnElement) btnElement.classList.add("active");
      activeCategoryTitle.innerText = `${category} Commands`;
      loadCommands(commandsData[category] || []);
    }

    // Render Commands Cards
    function loadCommands(list) {
      commandList.innerHTML = "";

      if (!list || list.length === 0) {
        commandList.innerHTML = "<p style='color: var(--pink); opacity: 0.6;'>No commands found matching your criteria.</p>";
        return;
      }

      list.forEach(cmd => {
        const card = document.createElement("div");
        card.className = "command-card";
        card.innerHTML = `
          <div class="command-header-row">
            <span class="command-name">${cmd.name}</span>
            <span class="command-usage">${cmd.usage}</span>
          </div>
          <p class="command-desc">${cmd.description || "No description provided."}</p>
        `;
        commandList.appendChild(card);
      });
    }

    // Live Search Filter
    searchInput.addEventListener("input", (e) => {
      const query = e.target.value.toLowerCase().trim();

      if (!query) {
        activeCategoryTitle.innerText = `${currentCategory} Commands`;
        loadCommands(commandsData[currentCategory]);
        return;
      }

      activeCategoryTitle.innerText = "Search Results";
      
      // Filter across all categories
      const filtered = [];
      Object.keys(commandsData).forEach(cat => {
        commandsData[cat].forEach(cmd => {
          if (
            cmd.name.toLowerCase().includes(query) ||
            cmd.usage.toLowerCase().includes(query) ||
            cmd.description.toLowerCase().includes(query)
          ) {
            filtered.push(cmd);
          }
        });
      });

      // Clear active styling from sidebar buttons while searching
      document.querySelectorAll(".category-btn").forEach(b => b.classList.remove("active"));
      loadCommands(filtered);
    });

    // Event Listeners
    if (menuBtn) menuBtn.addEventListener("click", openDrawer);
    if (closeBtn) closeBtn.addEventListener("click", closeDrawer);
    if (drawerOverlay) drawerOverlay.addEventListener("click", closeDrawer);

    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && sidebarNav.classList.contains("open")) {
        closeDrawer();
      }
    });

    // Initialize Page
    renderSidebar();
  </script>
</body>
</html>

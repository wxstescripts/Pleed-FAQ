<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Command Documentation</title>
  <style>
    :root {
      --bg-main: #0b0d12;
      --bg-card: #131620;
      --accent: #5865f2;
      --text: #f2f3f5;
      --text-muted: #949ba4;
      --border: #23272a;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg-main);
      color: var(--text);
      display: flex;
      min-height: 100vh;
    }

    /* Sidebar Styling */
    .sidebar-nav {
      width: 260px;
      background: #0f1117;
      border-right: 1px solid var(--border);
      padding: 20px 10px;
      height: 100vh;
      overflow-y: auto;
      position: sticky;
      top: 0;
    }

    .category-btn {
      width: 100%;
      text-align: left;
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 10px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 2px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .category-btn:hover, .category-btn.active {
      background: var(--bg-card);
      color: var(--text);
    }

    .category-btn.active {
      border-left: 3px solid var(--accent);
    }

    .count-badge {
      font-size: 11px;
      background: #202432;
      padding: 2px 6px;
      border-radius: 10px;
      color: var(--text-muted);
    }

    /* Main Content Area */
    .content-area {
      flex: 1;
      padding: 30px;
      max-width: 900px;
    }

    .command-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 12px;
    }

    .command-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }

    .command-name {
      font-family: monospace;
      font-size: 16px;
      color: var(--accent);
      font-weight: bold;
    }

    .command-usage {
      font-family: monospace;
      background: #090a0e;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 12px;
      color: #00e676;
    }

    .command-desc {
      color: var(--text-muted);
      font-size: 14px;
      margin: 0;
    }
  </style>
</head>
<body>

  <!-- Navigation Drawer -->
  <nav class="sidebar-nav" id="sidebarNav"></nav>

  <!-- Commands Container -->
  <main class="content-area">
    <h1 id="activeCategoryTitle">Commands</h1>
    <div id="commandList"></div>
  </main>

  <script>
    // Commands data source matching commands_2.json
    const commandsData = {
      "AI": [{ "name": "ai", "usage": ",ai <question>", "description": "Ask the AI a question." }],
      "AntiNuke": [{ "name": "antinuke", "usage": ",antinuke", "description": "Configure antinuke protection." }],
      "AutoMod": [{ "name": "automod", "usage": ",automod", "description": "Configure automod settings." }],
      "Automation": [
        { "name": "automation", "usage": ",automation", "description": "Automation control panel." },
        { "name": "reactadd", "usage": ",reactadd <emoji> <trigger>", "description": "Add auto reaction." },
        { "name": "autorespond", "usage": ",autorespond <trigger> <response>", "description": "Add auto response." }
      ],
      "Benchmark": [
        { "name": "benchmark", "usage": ",benchmark", "description": "Run full performance benchmark." },
        { "name": "benchdb", "usage": ",benchdb", "description": "Run database benchmark." }
      ],
      "Config": [
        { "name": "prefix", "usage": ",prefix <new_prefix>", "description": "Set server command prefix." },
        { "name": "setwelcome", "usage": ",setwelcome <channel>", "description": "Set welcome channel." }
      ],
      "Economy": [
        { "name": "balance", "usage": ",balance [member]", "description": "View balance." },
        { "name": "work", "usage": ",work", "description": "Work to earn money." },
        { "name": "daily", "usage": ",daily", "description": "Claim daily reward." }
      ],
      "Leveling": [
        { "name": "rank", "usage": ",rank [member]", "description": "View your rank or another user's rank." },
        { "name": "leaderboard", "usage": ",leaderboard", "description": "View leveling leaderboard." }
      ],
      "Moderation": [
        { "name": "kick", "usage": ",kick <member> [reason]", "description": "Kick a member from the server." },
        { "name": "ban", "usage": ",ban <member> [reason]", "description": "Ban a member from the server." },
        { "name": "mute", "usage": ",mute <member> [duration]", "description": "Mute a member." },
        { "name": "purge", "usage": ",purge <amount>", "description": "Delete messages in channel." }
      ],
      "Music": [
        { "name": "play", "usage": ",play <query>", "description": "Play a song in voice channel." },
        { "name": "skip", "usage": ",skip", "description": "Skip current playing song." },
        { "name": "queue", "usage": ",queue [page]", "description": "Show music queue." }
      ],
      "VoiceMaster": [
        { "name": "setupvc", "usage": ",setupvc [category]", "description": "Setup VoiceMaster trigger channel." },
        { "name": "vclock", "usage": ",vclock", "description": "Lock private voice channel." },
        { "name": "vcpermit", "usage": ",vcpermit <member>", "description": "Permit member into locked channel." }
      ]
    };

    function renderSidebar() {
      const sidebarNav = document.getElementById("sidebarNav");
      sidebarNav.innerHTML = "";

      Object.keys(commandsData).forEach((cat, index) => {
        const btn = document.createElement("button");
        btn.className = `category-btn ${index === 0 ? "active" : ""}`;
        btn.innerHTML = `<span>${cat}</span><span class="count-badge">${commandsData[cat].length}</span>`;
        btn.onclick = () => selectCategory(cat, btn);
        sidebarNav.appendChild(btn);
      });

      // Default load first category
      const firstCat = Object.keys(commandsData)[0];
      if (firstCat) loadCommands(firstCat);
    }

    function selectCategory(category, btnElement) {
      document.querySelectorAll(".category-btn").forEach(b => b.classList.remove("active"));
      btnElement.classList.add("active");
      loadCommands(category);
    }

    function loadCommands(category) {
      document.getElementById("activeCategoryTitle").innerText = `${category} Commands`;
      const container = document.getElementById("commandList");
      container.innerHTML = "";

      const list = commandsData[category] || [];
      if (list.length === 0) {
        container.innerHTML = "<p style='color: var(--text-muted);'>No commands available in this tab.</p>";
        return;
      }

      list.forEach(cmd => {
        const card = document.createElement("div");
        card.className = "command-card";
        card.innerHTML = `
          <div class="command-header">
            <span class="command-name">${cmd.name}</span>
            <span class="command-usage">${cmd.usage}</span>
          </div>
          <p class="command-desc">${cmd.description || "No description provided."}</p>
        `;
        container.appendChild(card);
      });
    }

    renderSidebar();
  </script>
</body>
</html>
